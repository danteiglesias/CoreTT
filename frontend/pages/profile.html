<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTT - Perfil</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <main class="container">
        <section id="profileContent"></section>
    </main>

    <!-- Modal Editar Perfil -->
    <div id="editProfileModal" class="modal">
        <div class="modal-content">
            <span class="close" data-close="editProfileModal">&times;</span>
            <h2>Editar Perfil</h2>
            <form id="editProfileForm">
                <input type="text" id="editName" placeholder="Nombre de usuario" required>
                <input type="text" id="editRank" placeholder="Rango (ej: Diamante, Global Elite)">
                <div id="profileEditError" class="form-error"></div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
