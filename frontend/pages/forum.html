<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTT - Foro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <main class="container">
        <section>
            <div class="filter-bar" style="border:none; padding:0; margin-bottom:0;">
                <div>
                    <h2 class="section-title" id="forumTitle">Foro de Discusion</h2>
                </div>
                <input type="text" id="forumSearch" class="search-input" placeholder="Buscar en el foro...">
                <button class="btn btn-accent" id="createPostBtn">+ Nuevo Post</button>
            </div>

            <div class="posts-list" id="postsContainer"></div>

            <div class="text-center mt-1">
                <button class="btn btn-secondary" id="loadMorePostsBtn" style="display:none;">Cargar mas</button>
            </div>
        </section>
    </main>

    <!-- Modal Nuevo Post -->
    <div id="newPostModal" class="modal">
        <div class="modal-content">
            <span class="close" data-close="newPostModal">&times;</span>
            <h2>Crear Nuevo Post</h2>
            <form id="newPostForm">
                <input type="text" id="postTitle" placeholder="Titulo del post" required>
                <textarea id="postBody" placeholder="Contenido de tu publicacion" required></textarea>
                <div id="postError" class="form-error"></div>
                <button type="submit" class="btn btn-primary">Publicar</button>
            </form>
        </div>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/forum.js"></script>
</body>
</html>
