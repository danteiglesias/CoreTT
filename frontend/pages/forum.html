<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTT - Foro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="../index.html" class="logo">CoreTT</a>
            <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="guides.html">Guías</a></li>
                <li><a href="forum.html">Foro</a></li>
                <li><a href="profile.html" id="profileLink" style="display:none;">Perfil</a></li>
                <li><a href="#" id="loginBtn">Iniciar Sesión</a></li>
                <li><a href="#" id="logoutBtn" style="display:none;">Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section>
            <div class="filter-bar" style="border:none; padding:0; margin-bottom:0; align-items:flex-start;">
                <div>
                    <h2 class="section-title" id="forumTitle">Foro de Discusión</h2>
                </div>
                <button class="btn btn-accent" id="createPostBtn">+ Nuevo Post</button>
            </div>

            <div class="posts-list" id="postsContainer"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; <span id="year">2026</span> CoreTT. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal de Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" data-close="loginModal">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="form-group password-wrapper">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="Contraseña" required>
                    <button type="button" class="password-toggle" aria-label="Mostrar contraseña">👁️</button>
                </div>
                <div id="loginError" class="form-error"></div>
                <button type="submit" class="btn btn-primary btn-block-mobile">Entrar</button>
            </form>
            <p>¿No tienes cuenta? <a href="#" id="signupLink">Regístrate</a></p>
        </div>
    </div>

    <!-- Modal de Registro -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close" data-close="signupModal">&times;</span>
            <h2>Registrarse</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupName">Nombre de usuario</label>
                    <input type="text" id="signupName" placeholder="Nombre de usuario" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="Email" required>
                </div>
                <div class="form-group password-wrapper">
                    <label for="signupPassword">Contraseña</label>
                    <input type="password" id="signupPassword" placeholder="Contraseña" required>
                    <button type="button" class="password-toggle" aria-label="Mostrar contraseña">👁️</button>
                </div>
                <div id="signupError" class="form-error"></div>
                <button type="submit" class="btn btn-primary btn-block-mobile">Crear cuenta</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="#" id="loginLink">Inicia sesión</a></p>
        </div>
    </div>

    <!-- Modal Nuevo Post -->
    <div id="newPostModal" class="modal large">
        <div class="modal-content">
            <span class="close" data-close="newPostModal">&times;</span>
            <h2>Crear Nuevo Post</h2>
            <form id="newPostForm">
                <div class="form-group">
                    <label for="postTitle">Título del post</label>
                    <input type="text" id="postTitle" placeholder="Título del post" required>
                </div>
                <div class="form-group">
                    <label for="postBody">Contenido de tu publicación</label>
                    <textarea id="postBody" placeholder="Escribe aquí tu publicación..." required></textarea>
                </div>
                <div id="postError" class="form-error"></div>
                <button type="submit" class="btn btn-primary btn-block-mobile">Publicar</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/forum.js"></script>
    <script>
        // Año dinámico en el footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Efecto scroll en navbar
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Toggle mostrar/ocultar contraseña
        document.querySelectorAll('.password-toggle').forEach(toggle => {
            toggle.addEventListener('click', () => {
                const input = toggle.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                toggle.textContent = type === 'password' ? '👁️' : '🙈';
            });
        });
    </script>
</body>
</html>
