<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTT - Guias</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <main class="container">
        <section>
            <h2 class="section-title">Guias de la Comunidad</h2>
            <div class="alert alert-info">
                Explora las guias de estrategia, lineups y analisis del meta. Vota las que te sirvan
                para que la comunidad las destaque.
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-game="Todos">Todos</button>
                <button class="filter-btn" data-game="League of Legends">LoL</button>
                <button class="filter-btn" data-game="Counter-Strike 2">CS2</button>
                <button class="filter-btn" data-game="Fortnite">Fortnite</button>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar guias...">
                <button class="btn btn-accent" id="createGuideBtn">+ Nueva Guia</button>
            </div>

            <div class="guides-grid" id="guidesContainer"></div>

            <div class="text-center mt-1">
                <button class="btn btn-secondary" id="loadMoreBtn" style="display:none;">Cargar mas</button>
            </div>
        </section>
    </main>

    <!-- Modal Nueva Guia -->
    <div id="newGuideModal" class="modal">
        <div class="modal-content">
            <span class="close" data-close="newGuideModal">&times;</span>
            <h2>Publicar Nueva Guia</h2>
            <form id="newGuideForm">
                <input type="text" id="guideTitle" placeholder="Titulo de la guia" required>
                <select id="guideGame" required>
                    <option value="">Selecciona el juego</option>
                    <option value="League of Legends">League of Legends</option>
                    <option value="Counter-Strike 2">Counter-Strike 2</option>
                    <option value="Fortnite">Fortnite</option>
                </select>
                <input type="text" id="guidePatch" placeholder="Parche / temporada (opcional)">
                <textarea id="guideDescription" placeholder="Breve descripcion" required></textarea>
                <textarea id="guideContent" placeholder="Contenido completo de la guia" required></textarea>
                <div id="guideError" class="form-error"></div>
                <button type="submit" class="btn btn-primary">Publicar</button>
            </form>
        </div>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/guides.js"></script>
</body>
</html>
