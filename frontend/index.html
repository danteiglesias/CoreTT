<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTT - Plataforma de Guias de Videojuegos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>CoreTT</h1>
            <p>La comunidad definitiva para guias y consejos de videojuegos</p>
            <button class="btn btn-primary" id="getStartedBtn">Comenzar</button>
        </div>
    </section>

    <!-- Contenido Principal -->
    <main class="container">
        <section class="featured-guides">
            <h2>Guias Destacadas</h2>
            <div class="guides-grid" id="guidesContainer">
                <!-- Se rellena dinamicamente (o se muestra HTML estatico en modo demo) -->
                <a href="pages/guides.html" class="guide-link">
                     <img src="assets/Counter Strike 2.png" alt="Counter Strike 2">
                </a>
                <a href="pages/guides.html" class="guide-link">
                     <img src="assets/League of Legends.png" alt="League of Legends">
                </a>
                <a href="pages/guides.html" class="guide-link">
                    <img src="assets/Fortnite.png" alt="Fortnite">
                </a>
            </div>
        </section>

        <section class="recent-posts">
            <h2>Posts Recientes del Foro</h2>
            <div class="posts-list" id="postsContainer"></div>
        </section>
    </main>

    <script src="js/core.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
