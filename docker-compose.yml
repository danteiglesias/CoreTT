services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: corett
      MYSQL_USER: corett
      # Sustituye estas credenciales antes de exponer el servicio.
      MYSQL_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en un archivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD en un archivo .env}
    # El puerto de MySQL no se publica: solo el contenedor "web" necesita
    # hablar con la base de datos. Publicarlo expone la BD a toda la red local.
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/datos_iniciales.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Monta el proyecto en el docroot. El .git y el .env quedan dentro del
      # webroot, por eso el Dockerfile los bloquea a nivel de servidor.
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: corett
      DB_USER: corett
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en un archivo .env}
      DB_CHARSET: utf8mb4
      # "production" para no filtrar mensajes de error de PDO. Usa
      # "development" solo en local.
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      # Solo IPs de proxies que controles.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@corett.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
